name: Release & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Serialize production releases, including manual dispatches; never cancel a rollout.
concurrency:
  group: release-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Check
        run: pnpm check

  security:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: ./.github/workflows/_codeql.yml

  build:
    needs: [validate, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # The migrations image builds from its own directory: the root
        # .dockerignore excludes apps/server/db from the root context.
        include:
          - app: client
            dockerfile: apps/client/Dockerfile
            context: .
          - app: server
            dockerfile: apps/server/Dockerfile
            context: .
          - app: migrations
            dockerfile: apps/server/db/Dockerfile
            context: apps/server/db
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up Node for digest records
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Record immutable build identity
        env:
          IMAGE_APP: ${{ matrix.app }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/deploy/cli.mjs record
      - name: Retain build identity
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment/images/${{ matrix.app }}.json
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: pnpm --filter @e-commerce/server semantic-release

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    permissions:
      id-token: write
      contents: read
      packages: write # retain the verified predecessor images under recovery tags
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SERVER_APP: ${{ vars.AZURE_SERVER_APP }}
      AZURE_CLIENT_APP: ${{ vars.AZURE_CLIENT_APP }}
      PREDECESSOR_IMAGES: ${{ vars.PREDECESSOR_IMAGES }}
    steps:
      - name: Checkout the exact built source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node for rollout verification
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Download this attempt's immutable build identities
        uses: actions/download-artifact@v8
        with:
          pattern: image-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment/images
          merge-multiple: true
      - name: Set up Docker Buildx for recovery retention
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Capture and retain verified predecessors
        run: node scripts/deploy/cli.mjs prepare
      - name: Persist recovery evidence before any Azure update
        uses: actions/upload-artifact@v7
        with:
          name: predecessors-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment/predecessors.json
          if-no-files-found: error
          retention-days: 90
      - name: Migrate and verify rollout with recovery
        run: node scripts/deploy/cli.mjs deploy
      - name: Retain deployment and recovery outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment/*.json
          if-no-files-found: warn
          retention-days: 90
