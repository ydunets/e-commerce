<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StyleNest care and materials</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: 'Noto Sans', system-ui, sans-serif;
        color: #171717;
        background: #fff;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 16px;
        margin: 0;
        font-size: 14px;
      }
      dt {
        color: #525252;
      }
    </style>
  </head>
  <body>
    <dl>
      <dt>Materials</dt>
      <dd>Organic cotton, recycled polyester</dd>
      <dt>Washing</dt>
      <dd>Machine wash cold, gentle cycle</dd>
      <dt>Drying</dt>
      <dd>Tumble dry low or hang to dry</dd>
      <dt>Ironing</dt>
      <dd>Low setting, no steam</dd>
      <dt>Origin</dt>
      <dd>Made in Portugal</dd>
    </dl>
  </body>
</html>
